# Runtime configuration for the elurny-website deployment (namespace `prod`).
#
# This file is a TEMPLATE with placeholder values — the real secret lives only
# in the cluster and is never committed. Create/update it with:
#
#   kubectl -n prod create secret generic elurny-website-env \
#     --from-literal=MONGODB_URI='mongodb+srv://...' \
#     --from-literal=MONGODB_DB='elurny' \
#     --from-literal=LEADS_NOTIFY_TO='sales@elurny.com' \
#     --from-literal=LEADS_NOTIFY_FROM='Lurny Website <website@elurny.com>' \
#     --from-literal=RESEND_API_KEY='re_...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n prod rollout restart deployment/elurny-website
#
# The deployment mounts it with `envFrom` (see deployment-patch.yaml), so
# every key becomes an environment variable. Keys mirror .env.example.
apiVersion: v1
kind: Secret
metadata:
  name: elurny-website-env
  namespace: prod
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/?retryWrites=true&w=majority"
  MONGODB_DB: "elurny"
  LEADS_NOTIFY_TO: "sales@elurny.com"
  LEADS_NOTIFY_FROM: "Lurny Website <website@elurny.com>"
  RESEND_API_KEY: "re_xxxxxxxxxxxxxxxxxxxxxxxx"
