name: Deploy elurny.com (AKS)

# Builds the Docker image (Next.js server on Node, `next start` on port 3000,
# see Dockerfile), pushes it to ACR and rolls the `elurny-website` deployment
# in the `prod` namespace of the `lurny` AKS cluster. Traffic for elurny.com
# and www.elurny.com reaches it via the in-cluster `prod/lurny-talk` ingress
# (service `elurny-website:80` -> container port 3000).
#
# Runtime secrets (MONGODB_URI, mail credentials) are NOT handled here: the
# deployment reads them from the Kubernetes secret `elurny-website-env`, which
# is managed in-cluster. See k8s/README.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AKS
        uses: devops-guru01/templates/kubernetes/aks@main
        with:
          deploy_branch: main
          container_registry: lunryai.azurecr.io
          container_repository: elurny-website
          service_name: elurny-website
          aks_cluster_name: lurny
          resource_group: AKS-Lunry
          dockerfile_path: Dockerfile
          app_port: "3000"
          k8s_namespace: prod
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
