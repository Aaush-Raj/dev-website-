name: Deploy elurny.com (AKS)

# Builds the Docker image (Next.js standalone server, see Dockerfile), pushes
# it to ACR and rolls the `elurny-website` deployment in the `prod` namespace
# of the `lurny` AKS cluster. Traffic for elurny.com and www.elurny.com reaches
# it via the in-cluster `prod/lurny-talk` ingress.
#
# PORT CHANGED FROM 80 TO 3000
# The image used to be nginx serving a static export. It is now Node serving
# the app, which listens on 3000 (Dockerfile: ENV PORT). The Service targetPort
# must match, or the rollout comes up healthy and every request times out.
#
# REQUIRED SECRETS (Kubernetes secret, injected as env vars on the deployment)
# The Trust Centre refuses all sign-ins unless these are present:
#   TRUST_CENTRE_EMAIL, TRUST_CENTRE_PASSWORD_HASH, TRUST_CENTRE_SECRET
#   AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_KEY, TRUST_CENTRE_CONTAINER
#   MONGODB_URI, MONGODB_DB
# Generate the first three with `npm run trust-centre:hash`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AKS
        uses: devops-guru01/templates/kubernetes/aks@main
        with:
          deploy_branch: main
          container_registry: lunryai.azurecr.io
          container_repository: elurny-website
          service_name: elurny-website
          aks_cluster_name: lurny
          resource_group: AKS-Lunry
          dockerfile_path: Dockerfile
          app_port: "3000"
          k8s_namespace: prod
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
