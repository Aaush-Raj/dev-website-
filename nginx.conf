# ---------------------------------------------------------------------------
# NOT USED BY THE APPLICATION IMAGE ANY MORE.
#
# This served the static export (out/) when the Dockerfile shipped an nginx
# image. The app now runs as a Next.js server on port 3000 and the Dockerfile
# no longer copies this file.
#
# It is kept because the cluster ingress in front of elurny.com still
# terminates TLS and proxies, and these are the rules that hop needs — in
# particular it MUST set X-Forwarded-For, which the Trust Centre's sign-in
# rate limiter uses to identify a caller (src/lib/trust-centre/rate-limit.ts).
#
# If you are editing headers for the live site, the application sets its own in
# next.config.ts; those now apply to every response regardless of this file.
# ---------------------------------------------------------------------------

# nginx config for the static Next.js export (out/) — see Dockerfile.
# Mirrors what public/staticwebapp.config.json used to do on Static Web Apps:
# security headers, immutable cache for hashed assets, real 404 page,
# no trailing slashes (next.config.ts: trailingSlash: false).

# Cache-Control per path. An empty value means the header is not added.
map $uri $elurny_cache_control {
    default                                          "";
    ~^/_next/static/                                 "public, max-age=31536000, immutable";
    ~*\.(avif|webp|png|jpe?g|gif|svg|ico|woff2?)$    "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the TLS-terminating ingress: emit relative Location headers so
    # /about/ -> /about stays on https instead of bouncing via http://.
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # Security headers ("always" = also on 404/301 responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control $elurny_cache_control always;

    # Next's not-found page is exported as /404.html
    error_page 404 /404.html;

    # Kubernetes / uptime probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # One canonical form: /about, never /about/
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }

    location / {
        # /about -> /about.html, /resources -> /resources.html (or /resources/index.html)
        try_files $uri $uri.html $uri/index.html =404;
    }
}
